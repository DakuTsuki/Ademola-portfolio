<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Ademola Adebayo | Web Developer</title>
    <meta name="title" content="Ademola Adebayo | Web Developer" />
    <meta name="description" content="Personal portfolio of Ademola Adebayo, a web developer from Nigeria. I build full websites: front end, PHP backend, MySQL database, and live hosting." />
    <meta name="author" content="Ademola Adebayo" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAF9F6" id="theme-color-meta" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ademola Adebayo | Web Developer" />
    <meta property="og:description" content="Web developer based in Nigeria. I build websites and get them online: front end, PHP APIs, MySQL, and production hosting." />
    <meta property="og:site_name" content="Ademola Adebayo Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ademola Adebayo | Web Developer" />
    <meta name="twitter:description" content="Web developer based in Nigeria. I build websites and get them online." />

    <!-- Favicon: AA Monogram -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Newsreader + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Inline script to prevent theme flash (FOUC) -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#111112');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-light-bg text-surface-light-text dark:bg-surface-dark-bg dark:text-surface-dark-text antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
